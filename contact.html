<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Staywithus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-800">

    <header class="border-b border-gray-100 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="text-rose-600 font-bold text-xl">
                <a href="index.html"><i class="fa-solid fa-house mr-1"></i> Staywithus</a>
            </div>
            <div class="space-x-4 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-black transition">Home</a>
                <a href="about.html" class="text-gray-600 hover:text-black transition">About</a>
                <a href="contact.html" class="text-black font-bold">Contact</a>
            </div>
        </div>
    </header>

    <section class="py-16 px-4 bg-gray-50 text-center border-b border-gray-100">
        <h1 class="text-3xl font-bold mb-4">Get in Touch</h1>
        <p class="text-gray-600 max-w-xl mx-auto">Have questions about your stay? Send us a message and our team will get back to you as soon as possible.</p>
    </section>

    <main class="max-w-4xl mx-auto px-4 py-16">
        <div class="grid md:grid-cols-3 gap-8 mb-12 text-center">
            <div class="p-6">
                <div class="text-rose-600 text-2xl mb-2"><i class="fa-solid fa-envelope"></i></div>
                <h4 class="font-bold">Email Us</h4>
                <p class="text-gray-500 text-sm">hello@staywithus.co.uk</p>
            </div>
            <div class="p-6">
                <div class="text-rose-600 text-2xl mb-2"><i class="fa-solid fa-circle-info"></i></div>
                <h4 class="font-bold">Support</h4>
                <p class="text-gray-500 text-sm">24/7 Online Help Desk</p>
            </div>
            <div class="p-6">
                <div class="text-rose-600 text-2xl mb-2"><i class="fa-solid fa-phone"></i></div>
                <h4 class="font-bold">Call Us</h4>
                <p class="text-gray-500 text-sm">+44 (0) 29 2012 3456</p>
            </div>
        </div>

        <div class="bg-white border border-gray-200 p-8 md:p-12 rounded-2xl shadow-sm max-w-2xl mx-auto">
            <form action="#" method="POST" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-2">Your Name</label>
                        <input type="text" placeholder="Full Name" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Email Address</label>
                        <input type="email" placeholder="email@example.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Message</label>
                    <textarea rows="5" placeholder="Tell us how we can help..." class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-4 rounded-xl hover:bg-rose-700 transition shadow-lg shadow-rose-200">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <footer class="py-10 text-center text-gray-400 text-xs">
        <p>&copy; 2026 Staywithus Wales. All rights reserved.</p>
    </footer>

</body>
</html>
